name: Phase 2 LIGHT — Deploy D1 + Worker + Tests

on:
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-staging:
    name: Deploy to Staging (Sandbox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler globally
        run: npm install -g wrangler

      - name: Create D1 Staging Database
        run: |
          echo "Creating D1 staging database..."
          wrangler d1 create apporteurs-crm-staging --yes || echo "Database may already exist"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Initialize D1 Schema
        run: |
          echo "Initializing schema..."
          wrangler d1 execute apporteurs-crm-staging --file schema-d1.sql
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker to Staging
        run: |
          echo "Deploying Worker v11 to staging..."
          wrangler deploy --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run E2E Tests (Mock)
        run: |
          echo "Running E2E tests with mocked data..."
          node .github/workflows/tests-e2e-mock.js
        continue-on-error: false

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Phase 2 LIGHT staging deployment successful!"
          echo "Worker deployed to: staging.immobilierlieusaint.fr/api/*"
          echo "D1 databases created: apporteurs-crm-staging"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Phase 2 LIGHT deployment failed!"
          echo "Check logs above for details"
        continue-on-error: true

  deploy-production:
    name: Deploy to Production (Manual Approval)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://simu.immobilierlieusaint.fr/api/ping

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler globally
        run: npm install -g wrangler

      - name: Create D1 Production Database
        run: |
          echo "⚠️ Production databases will be created on first push..."
          wrangler d1 create apporteurs-crm-prod --yes || echo "Production database may already exist"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Initialize D1 Production Schema
        run: |
          echo "Initializing production schema..."
          wrangler d1 execute apporteurs-crm-prod --file schema-d1.sql
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker to Production
        run: |
          echo "🚀 Deploying Worker v11 to production..."
          wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify Production Deployment
        run: |
          echo "✅ Production deployment complete!"
          echo "Route: simu.immobilierlieusaint.fr/api/calcul-commission-apporteur"

      - name: Post-Deployment Checklist
        run: |
          echo "📋 Post-deployment checklist:"
          echo "1. Verify ping: GET simu.immobilierlieusaint.fr/api/ping"
          echo "2. Test calculation: POST /calcul-commission-apporteur with test data"
          echo "3. Check D1: wrangler d1 execute apporteurs-crm-prod --command 'SELECT * FROM commissions'"
          echo "4. Verify HubSpot Deal property update"
          echo "5. Check email notification received at harry@immobilierlieusaint.fr"
