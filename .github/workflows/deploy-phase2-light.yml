name: Phase 2 LIGHT — Deploy D1 + Worker + Tests

on:
  push:
    branches:
      - main
      - principal
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-staging:
    name: Deploy to Staging (Sandbox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler globally
        run: npm install -g wrangler@3.25.0

      - name: Create D1 Staging Database
        run: |
          echo "Creating D1 staging database (ignored if already exists)..."
          wrangler d1 create apporteurs-crm-staging 2>&1 || echo "DB already exists, continuing..."
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Get D1 Staging UUID via Cloudflare API
        run: |
          echo "Fetching staging DB UUID from Cloudflare REST API..."
          API_RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")
          DB_UUID=$(echo "$API_RESP" | jq -r '.result[] | select(.name=="apporteurs-crm-staging") | .uuid // empty' 2>/dev/null || echo "")
          echo "Staging DB UUID: '$DB_UUID'"
          if [ -z "$DB_UUID" ]; then
            echo "API response: $API_RESP"
            echo "ERROR: could not retrieve staging DB UUID"
            exit 1
          fi
          sed -i "s/database_id = \"STAGING_ID\"/database_id = \"$DB_UUID\"/" wrangler-d1.toml
          echo "wrangler-d1.toml updated with staging DB ID: $DB_UUID"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Initialize D1 Schema
        run: |
          echo "Initializing schema..."
          wrangler d1 execute apporteurs-crm-staging --file schema-d1.sql --config wrangler-d1.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker to Staging
        run: |
          echo "Deploying Worker v11 to staging..."
          wrangler deploy --env staging --config wrangler-d1.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run E2E Tests (Mock)
        run: |
          echo "Running E2E tests with mocked data..."
          node .github/workflows/tests-e2e-mock.js
        continue-on-error: false

      - name: Notify Success
        if: success()
        run: echo "Phase 2 LIGHT staging deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Phase 2 LIGHT deployment failed — check logs above"
        continue-on-error: true

  deploy-production:
    name: Deploy to Production (Manual Approval)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://simu.immobilierlieusaint.fr/api/ping

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler globally
        run: npm install -g wrangler@3.25.0

      - name: Create D1 Production Database
        run: |
          echo "Creating D1 production database (ignored if already exists)..."
          wrangler d1 create apporteurs-crm-prod 2>&1 || echo "DB already exists, continuing..."
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Get D1 Production UUID via Cloudflare API
        run: |
          echo "Fetching production DB UUID from Cloudflare REST API..."
          API_RESP=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")
          DB_UUID=$(echo "$API_RESP" | jq -r '.result[] | select(.name=="apporteurs-crm-prod") | .uuid // empty' 2>/dev/null || echo "")
          echo "Production DB UUID: '$DB_UUID'"
          if [ -z "$DB_UUID" ]; then
            echo "API response: $API_RESP"
            echo "ERROR: could not retrieve production DB UUID"
            exit 1
          fi
          sed -i "s/database_id = \"PROD_ID\"/database_id = \"$DB_UUID\"/" wrangler-d1.toml
          echo "wrangler-d1.toml updated with production DB ID: $DB_UUID"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Initialize D1 Production Schema
        run: |
          echo "Initializing production schema..."
          wrangler d1 execute apporteurs-crm-prod --file schema-d1.sql --config wrangler-d1.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker to Production
        run: |
          echo "Deploying Worker v11 to production..."
          wrangler deploy --env production --config wrangler-d1.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Post-Deployment Checklist
        run: |
          echo "Post-deployment checklist:"
          echo "1. Test: GET simu.immobilierlieusaint.fr/api/ping"
          echo "2. Test: POST /calcul-commission-apporteur"
          echo "3. Verifier Deal HubSpot mis a jour"
          echo "4. Verifier email recu a harry@immobilierlieusaint.fr"
